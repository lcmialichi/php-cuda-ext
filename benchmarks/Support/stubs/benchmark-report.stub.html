<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>{{STYLE}}</style>
</head>

<body>
    <div class="container">
        <header class="report-header">
            <div class="header-content">
                <h1><i class="fas fa-rocket"></i> CUDA Benchmark Report</h1>
                <div class="header-info">
                    <div class="info-item">
                        <i class="far fa-clock"></i>
                        <span>Generated: {{GENERATED_AT}}</span>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-microchip"></i>
                        <span>{{DEVICE}}</span>
                    </div>
                </div>
            </div>
        </header>

        <nav class="report-nav">
            <a href="#summary" class="nav-link active" data-section="summary">
                <i class="fas fa-chart-bar"></i> Summary
            </a>
            <a href="#comparison" class="nav-link" data-section="comparison">
                <i class="fas fa-balance-scale"></i> Comparison
            </a>
        </nav>

        <main class="report-main">
            <section id="summary" class="report-section active">
                {{SUMMARY_SECTION}}
            </section>

            <section id="comparison" class="report-section">
                {{COMPARISON_SECTION}}
            </section>
        </main>

        <footer class="report-footer">
            <div class="footer-content">
                <p>
                    <i class="fas fa-code"></i> Generated with PHP CUDA Benchmark System |
                    <i class="fas fa-chart-line"></i> Performance Analytics
                </p>
                <p class="footer-note">
                    Report ID: <code>cuda-benchmark-{{TIMESTAMP}}</code>
                </p>
            </div>
        </footer>
    </div>

    <script>{{SCRIPTS}}</script>
</body>

</html>
