<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <!-- Bootstrap 5 Dark Theme -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>{{STYLE}}</style>
</head>

<body>
    <div class="container-fluid px-4 py-3">
        <!-- Header -->
        <div class="header-section mb-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h1 class="display-6 fw-bold mb-1">
                        <i class="bi bi-speedometer2 me-2"></i>CUDA Benchmark Report
                    </h1>
                    <p class="text-muted mb-0">
                        <i class="bi bi-cpu me-1"></i> {{DEVICE}}
                        <span class="mx-2">•</span>
                        <i class="bi bi-clock me-1"></i> {{GENERATED_AT}}
                    </p>
                </div>
                <div class="badge bg-primary bg-opacity-25 text-primary px-3 py-2">
                    <i class="bi bi-code me-2"></i>CUDA Benchmark System
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="nav-tabs-section mb-4">
            <div class="nav nav-pills nav-fill" id="nav-tab" role="tablist">
                <button class="nav-link active" id="nav-summary-tab" data-bs-toggle="tab" 
                        data-bs-target="#nav-summary" type="button" role="tab">
                    <i class="bi bi-bar-chart me-2"></i>Summary
                </button>
                <button class="nav-link" id="nav-comparison-tab" data-bs-toggle="tab" 
                        data-bs-target="#nav-comparison" type="button" role="tab">
                    <i class="bi bi-grid-3x3-gap me-2"></i>Comparison
                </button>
                <button class="nav-link" id="nav-charts-tab" data-bs-toggle="tab" 
                        data-bs-target="#nav-charts" type="button" role="tab">
                    <i class="bi bi-graph-up me-2"></i>Charts
                </button>
            </div>
        </nav>

        <!-- Tab Content -->
        <div class="tab-content" id="nav-tabContent">
            <div class="tab-pane fade show active" id="nav-summary" role="tabpanel">
                {{SUMMARY_SECTION}}
            </div>
            <div class="tab-pane fade" id="nav-comparison" role="tabpanel">
                {{COMPARISON_SECTION}}
            </div>
            <div class="tab-pane fade" id="nav-charts" role="tabpanel">
                {{CHARTS_SECTION}}
            </div>
        </div>

        <!-- Footer -->
        <footer class="mt-5 pt-4 border-top">
            <div class="row">
                <div class="col-md-6">
                    <p class="text-muted">
                        <i class="bi bi-info-circle me-2"></i>
                        Generated with PHP CUDA Benchmark System
                    </p>
                </div>
                <div class="col-md-6 text-md-end">
                    <p class="text-muted">
                        Report ID: <code class="ms-2">cuda-benchmark-{{TIMESTAMP}}</code>
                    </p>
                </div>
            </div>
        </footer>
    </div>

    <!-- Details Modal -->
    <div class="modal fade" id="detailsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content glass-card">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-bar-chart me-2"></i>Test Results
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalBody">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-3 text-muted">Loading test details...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Benchmark Data -->
    <script>
        window.benchmarkData = {{BENCHMARKS_DATA_JSON}};
    </script>
    
    <!-- Main Script -->
    <script>{{SCRIPTS}}</script>
</body>

</html>
