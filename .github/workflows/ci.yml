name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-cpu-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build extension and run CPU tests without a GPU
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            nvidia/cuda:12.3.2-devel-ubuntu22.04 \
            bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              export TZ=Etc/UTC
              apt-get update
              apt-get install -y --no-install-recommends \
                php8.1-cli php8.1-dev build-essential autoconf pkg-config libtool
              bash ./compile.sh
              bash ./run-tests.sh --cpu-only
            '

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-cpu-tests
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate semantic version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          MODULE_VERSION=$(sed -n 's/^#define PHP_CUDA_VERSION "\(.*\)"/\1/p' src/cuda.h)
          RELEASE_VERSION="${RELEASE_TAG#v}"
          if [[ "$MODULE_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match module version $MODULE_VERSION" >&2
            exit 1
          fi

      - name: Create draft release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --generate-notes